<style>
  :root {
    --ink: #121A22;
    --brass: #B99B63;
    --brass-hi: #DCC697;
    --ivory: #EEE7D8;
    --mute: rgba(238, 231, 216, .58);
    --hair: rgba(185, 155, 99, .45);
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--ink); }
  body {
    min-height: 100dvh; color: var(--ivory); overflow-x: hidden;
    font-family: 'Noto Kufi Arabic', system-ui, sans-serif; -webkit-font-smoothing: antialiased;
    background: radial-gradient(120% 60% at 50% -8%, rgba(220, 198, 151, .13), transparent 60%), var(--ink);
  }
  a { color: inherit; text-decoration: none; -webkit-tap-highlight-color: transparent; }
  a:focus-visible { outline: 1px solid var(--brass-hi); outline-offset: 6px; border-radius: 2px; }
  main { max-width: 440px; margin: 0 auto; padding: 40px 16px 44px; text-align: center; }

  /* القوس: العنصر الوحيد اللافت في الصفحة */
  .arch { position: relative; width: min(100%, 340px); margin: 0 auto; aspect-ratio: 340 / 400; }
  .arch svg.frame { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .frame path { fill: none; stroke: var(--brass); vector-effect: non-scaling-stroke; }
  .frame .o { stroke-width: 1.2; }
  .frame .i { stroke-width: .7; opacity: .7; }
  .frame .base { stroke-width: 1.2; }
  .inside { position: absolute; inset: 30% 12% 12%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .mark { width: 34px; height: 40px; color: var(--brass-hi); }
  .name { font-family: 'Amiri', serif; font-weight: 700; font-size: clamp(58px, 17vw, 72px); line-height: 1; margin-top: 14px; color: var(--ivory); }
  .sub { font-family: 'Amiri', serif; font-size: 22px; color: var(--brass-hi); margin-top: 4px; letter-spacing: .5px; }
  .motto { font-family: 'Amiri', serif; font-size: 20px; line-height: 1.7; color: var(--mute); margin-top: 22px; }

  .star { display: block; width: 22px; height: 22px; margin: 34px auto; color: var(--brass); }

  /* المشاريع: قائمة كتابية، بدون صناديق */
  .works { display: grid; gap: 30px; }
  .work { display: block; padding: 4px 0; }
  .work b { display: block; font-family: 'Amiri', serif; font-weight: 700; font-size: 34px; line-height: 1.2; transition: color .2s ease; }
  .work span { display: block; font-size: 13.5px; color: var(--mute); margin-top: 6px; line-height: 1.8; }
  .work:hover b, .work:focus-visible b { color: var(--brass-hi); }

  .contact { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 42px; min-height: 54px; border: 1px solid var(--hair); border-radius: 999px; font-size: 15px; color: var(--brass-hi); transition: background .2s ease, border-color .2s ease; }
  .contact:hover { background: rgba(185, 155, 99, .08); border-color: var(--brass); }
  .contact svg { width: 18px; height: 18px; }

  footer { margin-top: 30px; font-size: 12.5px; color: rgba(238, 231, 216, .42); line-height: 2; }
  footer a { color: var(--mute); border-bottom: 1px solid rgba(185, 155, 99, .35); }

  /* لحظة وحدة عند الفتح: القوس ينرسم، وبعدها يظهر الكلام */
  @media (prefers-reduced-motion: no-preference) {
    .frame path { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.6s cubic-bezier(.6, .1, .2, 1) forwards; }
    .frame .i { animation-delay: .25s; }
    .frame .base { animation-delay: .9s; animation-duration: .8s; }
    .inside, .after { opacity: 0; animation: show .9s ease 1.1s forwards; }
    .after { animation-delay: 1.5s; }
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes show { to { opacity: 1; } }
</style>
